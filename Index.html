<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #00A884, #005F4E);
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 25px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #005F4E;
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #777;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: #00A884;
        }

        .tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00A884;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tab.active::after {
            transform: scaleX(1);
        }

        .forms-wrapper {
            position: relative;
            height: 200px;
        }

        .form-container {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s ease;
            visibility: hidden;
        }

        .form-container.active {
            opacity: 1;
            transform: translateX(0);
            visibility: visible;
        }

        .form-container.previous {
            transform: translateX(-100%);
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #00A884;
            outline: none;
        }

        .continue-btn {
            width: 100%;
            padding: 12px;
            background: #00A884;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .continue-btn:hover {
            background: #005F4E;
            transform: translateY(-2px);
        }

        .continue-btn:active {
            transform: translateY(0);
        }

        .divider {
            margin: 20px 0;
            color: #aaa;
            font-size: 14px;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            background: #f7f7f7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .terms {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }

        .terms a {
            color: #00A884;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .terms a:hover {
            color: #005F4E;
            text-decoration: underline;
        }

        .error-message {
            color: #ff3333;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }

        .success-message {
            color: #00A884;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }

        .user-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .logout-btn {
            background: #ff3333;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #cc0000;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: #00A884;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .verification-banner {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .verification-banner button {
            background: #856404;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }

        .close-modal {
            position: absolute;
            right: 10px;
            top: 10px;
            cursor: pointer;
            font-size: 20px;
        }

        /* Add all previous CSS here */
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome Back</h1>
        
        <div id="auth-container">
            <!-- Verification Banner -->
            <div class="verification-banner" id="verification-banner">
                Please verify your email address.
                <button id="resend-verification">Resend Email</button>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="signin">Sign In</button>
                <button class="tab" data-tab="signup">Sign Up</button>
            </div>
            
            <div class="forms-wrapper">
                <!-- Sign In Form -->
                <div class="form-container active" id="signin-form">
                    <div class="error-message" id="signin-error"></div>
                    <div class="success-message" id="signin-success"></div>
                    <form id="signin-form-element">
                        <input type="email" class="input-field" placeholder="Email address" id="signin-email" required>
                        <input type="password" class="input-field" placeholder="Password" id="signin-password" required>
                        <div class="forgot-password">
                            <a href="#" id="forgot-password-link">Forgot Password?</a>
                        </div>
                        <button type="submit" class="continue-btn">Sign In</button>
                    </form>
                </div>
                
                <!-- Sign Up Form -->
                <div class="form-container" id="signup-form">
                    <div class="error-message" id="signup-error"></div>
                    <div class="success-message" id="signup-success"></div>
                    <form id="signup-form-element">
                        <input type="email" class="input-field" placeholder="Email address" id="signup-email" required>
                        <input type="password" class="input-field" placeholder="Password" id="signup-password" required>
                        <input type="password" class="input-field" placeholder="Confirm Password" id="signup-confirm-password" required>
                        <button type="submit" class="continue-btn">Sign Up</button>
                    </form>
                </div>
            </div>
            
            <p class="divider">or</p>
            
            <button class="google-btn" id="google-signin">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" width="20">
                Continue with Google
            </button>
        </div>

        </div>

        <!-- User Info Section -->
        <div class="user-info" id="user-info">
            <h2>Welcome, <span id="user-email"></span></h2>
            <button class="continue-btn logout-btn" id="logout-btn">Logout</button>
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div class="modal" id="reset-password-modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h2>Reset Password</h2>
            <div class="error-message" id="reset-error"></div>
            <div class="success-message" id="reset-success"></div>
            <form id="reset-password-form">
                <input type="email" class="input-field" placeholder="Enter your email" id="reset-email" required>
                <button type="submit" class="continue-btn">Send Reset Link</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
      <!-- Firebase SDKs -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore-compat.min.js"></script>
  

    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDEvrtHxsIPBXzVro-WhtBwXO1Qvx9jKWk",
  authDomain: "abstore-1e937.firebaseapp.com",
  projectId: "abstore-1e937",
  storageBucket: "abstore-1e937.firebasestorage.app",
  messagingSenderId: "39833645659",
  appId: "1:39833645659:web:98022d92e05556f37d057e",
  measurementId: "G-XHGW8ZTGQZ"
};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // UI Elements
        const authContainer = document.getElementById('auth-container');
        const userInfo = document.getElementById('user-info');
        const userEmail = document.getElementById('user-email');
        const signupForm = document.getElementById('signup-form-element');
        const signinForm = document.getElementById('signin-form-element');
        const googleSignIn = document.getElementById('google-signin');
        const logoutBtn = document.getElementById('logout-btn');

        // Error and Success Messages
        const signupError = document.getElementById('signup-error');
        const signinError = document.getElementById('signin-error');
        const signupSuccess = document.getElementById('signup-success');
        const signinSuccess = document.getElementById('signin-success');

        // Additional UI Elements
        const verificationBanner = document.getElementById('verification-banner');
        const resendVerificationBtn = document.getElementById('resend-verification');
        const resetPasswordModal = document.getElementById('reset-password-modal');
        const resetPasswordForm = document.getElementById('reset-password-form');
        const closeModalBtn = document.getElementById('close-modal');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const resetError = document.getElementById('reset-error');
        const resetSuccess = document.getElementById('reset-success');

        // Enhanced Auth State Observer
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                authContainer.style.display = 'none';
                userInfo.style.display = 'block';
                userEmail.textContent = user.email;

                // Check email verification status
                if (!user.emailVerified) {
                    verificationBanner.style.display = 'block';
                } else {
                    verificationBanner.style.display = 'none';
                }

                // Update user data
                await db.collection('users').doc(user.uid).set({
                    email: user.email,
                    emailVerified: user.emailVerified,
                    lastLogin: new Date()
                }, { merge: true });
            } else {
                authContainer.style.display = 'block';
                userInfo.style.display = 'none';
                userEmail.textContent = '';
                verificationBanner.style.display = 'none';
            }
        });

        // Enhanced Sign Up with Email Verification
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            signupError.style.display = 'none';
            signupSuccess.style.display = 'none';

            if (password !== confirmPassword) {
                signupError.textContent = 'Passwords do not match';
                signupError.style.display = 'block';
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                
                // Send verification email
                await userCredential.user.sendEmailVerification();
                
                signupSuccess.textContent = 'Account created successfully! Please check your email for verification.';
                signupSuccess.style.display = 'block';
                signupForm.reset();

                await db.collection('users').doc(userCredential.user.uid).set({
                    email: email,
                    emailVerified: false,
                    createdAt: new Date(),
                    lastLogin: new Date()
                });
            } catch (error) {
                signupError.textContent = error.message;
                signupError.style.display = 'block';
            }
        });

        // Resend Verification Email
        resendVerificationBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (user && !user.emailVerified) {
                try {
                    await user.sendEmailVerification();
                    alert('Verification email sent! Please check your inbox.');
                } catch (error) {
                    alert('Error sending verification email: ' + error.message);
                }
            }
        });

        // Password Reset Modal Handlers
        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            resetPasswordModal.style.display = 'block';
            resetPasswordForm.reset();
            resetError.style.display = 'none';
            resetSuccess.style.display = 'none';
        });

        closeModalBtn.addEventListener('click', () => {
            resetPasswordModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === resetPasswordModal) {
                resetPasswordModal.style.display = 'none';
            }
        });

        // Password Reset Handler
        resetPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;

            resetError.style.display = 'none';
            resetSuccess.style.display = 'none';

            try {
                await auth.sendPasswordResetEmail(email);
                resetSuccess.textContent = 'Password reset email sent! Please check your inbox.';
                resetSuccess.style.display = 'block';
                resetPasswordForm.reset();
                
                // Close modal after 3 seconds
                setTimeout(() => {
                    resetPasswordModal.style.display = 'none';
                }, 3000);
            } catch (error) {
                resetError.textContent = error.message;
                resetError.style.display = 'block';
            }
        });

        // Enhanced Sign In to Check Email Verification
        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            signinError.style.display = 'none';
            signinSuccess.style.display = 'none';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                if (!userCredential.user.emailVerified) {
                    signinSuccess.textContent = 'Signed in successfully! Please verify your email.';
                } else {
                    signinSuccess.textContent = 'Signed in successfully!';
                }
                signinSuccess.style.display = 'block';
                signinForm.reset();
            } catch (error) {
                signinError.textContent = error.message;
                signinError.style.display = 'block';
            }
        });

        // Previous code for Google Sign In, Logout, and Tab Switching remains the same
        googleSignIn.addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                // Store user data
                await db.collection('users').doc(result.user.uid).set({
                    email: result.user.email,
                    displayName: result.user.displayName,
                    lastLogin: new Date()
                }, { merge: true });
            } catch (error) {
                signinError.textContent = error.message;
                signinError.style.display = 'block';
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await auth.signOut();
            } catch (error) {
                console.error('Error signing out:', error);
            }
        });

        // Tab Switching Logic (previous code)
        const tabs = document.querySelectorAll('.tab');
        const forms = document.querySelectorAll('.form-container');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                forms.forEach(form => {
                    form.classList.remove('active');
                    form.classList.add('previous');
                });
                
                tab.classList.add('active');
                const targetForm = document.getElementById(`${tab.dataset.tab}-form`);
                targetForm.classList.add('active');
                targetForm.classList.remove('previous');
            });
        });
    </script>
    </script>
</body>
</html>
