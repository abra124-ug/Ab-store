<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Interface</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #00A884, #005F4E);
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 25px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #005F4E;
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #777;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: #00A884;
        }

        .tab::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00A884;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tab.active::after {
            transform: scaleX(1);
        }

        .forms-wrapper {
            position: relative;
            height: 200px;
        }

        .form-container {
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s ease;
            visibility: hidden;
        }

        .form-container.active {
            opacity: 1;
            transform: translateX(0);
            visibility: visible;
        }

        .form-container.previous {
            transform: translateX(-100%);
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #00A884;
            outline: none;
        }

        .continue-btn {
            width: 100%;
            padding: 12px;
            background: #00A884;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .continue-btn:hover {
            background: #005F4E;
            transform: translateY(-2px);
        }

        .continue-btn:active {
            transform: translateY(0);
        }

        .divider {
            margin: 20px 0;
            color: #aaa;
            font-size: 14px;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            background: #f7f7f7;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .terms {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }

        .terms a {
            color: #00A884;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .terms a:hover {
            color: #005F4E;
            text-decoration: underline;
        }

        .error-message {
            color: #ff3333;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }

        .success-message {
            color: #00A884;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }

        .user-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .logout-btn {
            background: #ff3333;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #cc0000;
        }
        
        .account-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            color: #00A884;
            transition: transform 0.3s ease;
        }

        .account-icon:hover {
            transform: scale(1.1);
        }

        .profile-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .profile-content {
            position: relative;
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            color: #777;
        }

        .profile-section {
            margin-bottom: 25px;
        }

        .profile-section h3 {
            color: #005F4E;
            margin-bottom: 15px;
        }

        .profile-form {
            display: grid;
            gap: 15px;
        }

        .profile-links {
            display: grid;
            gap: 10px;
            margin: 20px 0;
        }

        .profile-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            color: #333;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .profile-link:hover {
            background: #e5e5e5;
        }

        .danger-zone {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .danger-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .danger-btn:hover {
            background: #cc0000;
        }

        .setup-complete {
            display: none;
            text-align: center;
            padding: 20px;
            background: #f0f9f7;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>  
</head>
<body>
    <div class="container">
        <h1>Welcome Back</h1>
        
        <div id="auth-container">
            <div class="tabs">
                <button class="tab active" data-tab="signin">Sign In</button>
                <button class="tab" data-tab="signup">Sign Up</button>
            </div>
            
            <div class="forms-wrapper">
                <!-- Sign In Form -->
                <div class="form-container active" id="signin-form">
                    <div class="error-message" id="signin-error"></div>
                    <div class="success-message" id="signin-success"></div>
                    <form id="signin-form-element">
                        <input type="email" class="input-field" placeholder="Email address" id="signin-email" required>
                        <input type="password" class="input-field" placeholder="Password" id="signin-password" required>
                        <button type="submit" class="continue-btn">Sign In</button>
                    </form>
                </div>
                
                <!-- Sign Up Form -->
                <div class="form-container" id="signup-form">
                    <div class="error-message" id="signup-error"></div>
                    <div class="success-message" id="signup-success"></div>
                    <form id="signup-form-element">
                        <input type="email" class="input-field" placeholder="Email address" id="signup-email" required>
                        <input type="password" class="input-field" placeholder="Password" id="signup-password" required>
                        <input type="password" class="input-field" placeholder="Confirm Password" id="signup-confirm-password" required>
                        <button type="submit" class="continue-btn">Sign Up</button>
                    </form>
                </div>
            </div>
            
            <p class="divider">or</p>
            
            <button class="google-btn" id="google-signin">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" width="20">
                Continue with Google
            </button>
        </div>

        <!-- User Info Section (shown after login) -->
    <div id="account-section" style="display: none;">
        <i class="account-icon" data-lucide="user-circle" id="account-icon"></i>
    </div>

    <!-- Profile Modal -->
    <div class="profile-modal" id="profile-modal">
        <div class="profile-content">
            <i class="close-modal" data-lucide="x" id="close-modal"></i>
            
            <div class="setup-complete" id="setup-complete">
                Profile setup complete! You can always edit your information later.
            </div>

            <div class="profile-section">
                <h3>Profile Information</h3>
                <form class="profile-form" id="profile-form">
                    <input type="text" class="input-field" id="display-name" placeholder="Display Name">
                    <input type="text" class="input-field" id="location" placeholder="Location">
                    <button type="submit" class="continue-btn">Save Profile</button>
                </form>
            </div>

            <div class="profile-links">
                <a href="#" class="profile-link" id="cart-link">
                    <i data-lucide="shopping-cart"></i>
                    View Cart
                </a>
                <a href="#" class="profile-link" id="orders-link">
                    <i data-lucide="package"></i>
                    Order History
                </a>
            </div>

            <div class="danger-zone">
                <button class="continue-btn logout-btn" id="logout-btn">Logout</button>
                <button class="danger-btn" id="delete-account-btn">Delete Account</button>
            </div>
        </div>
    </div>
        
        <p class="terms">
            By continuing, you accept our 
            <a href="#">Terms of Service</a>, 
            <a href="#">Privacy Policy</a>, and 
            <a href="#">Cookies Policy</a>.
        </p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore-compat.min.js"></script>

    <script>
        // Your Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDEvrtHxsIPBXzVro-WhtBwXO1Qvx9jKWk",
  authDomain: "abstore-1e937.firebaseapp.com",
  projectId: "abstore-1e937",
  storageBucket: "abstore-1e937.firebasestorage.app",
  messagingSenderId: "39833645659",
  appId: "1:39833645659:web:98022d92e05556f37d057e",
  measurementId: "G-XHGW8ZTGQZ"
};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        lucide.createIcons();

        // UI Elements
        const authContainer = document.getElementById('auth-container');
        const userInfo = document.getElementById('user-info');
        const userEmail = document.getElementById('user-email');
        const signupForm = document.getElementById('signup-form-element');
        const signinForm = document.getElementById('signin-form-element');
        const googleSignIn = document.getElementById('google-signin');
        const logoutBtn = document.getElementById('logout-btn');
        // Additional JavaScript for profile management
        const accountIcon = document.getElementById('account-icon');
        const profileModal = document.getElementById('profile-modal');
        const closeModal = document.getElementById('close-modal');
        const profileForm = document.getElementById('profile-form');
        const deleteAccountBtn = document.getElementById('delete-account-btn');
        const accountSection = document.getElementById('account-section');
        const setupComplete = document.getElementById('setup-complete');

        // Error and Success Messages
        const signupError = document.getElementById('signup-error');
        const signinError = document.getElementById('signin-error');
        const signupSuccess = document.getElementById('signup-success');
        const signinSuccess = document.getElementById('signin-success');

        // Modified auth state observer
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                authContainer.style.display = 'none';
                accountSection.style.display = 'block';

                // Check if profile exists
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    if (userData.displayName) {
                        document.getElementById('display-name').value = userData.displayName;
                    }
                    if (userData.location) {
                        document.getElementById('location').value = userData.location;
                    }
                    if (userData.profileComplete) {
                        setupComplete.style.display = 'block';
                    }
                }
            } else {
                authContainer.style.display = 'block';
                accountSection.style.display = 'none';
                profileModal.style.display = 'none';
            }
        });
        
        // Sign Up
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            // Reset messages
            signupError.style.display = 'none';
            signupSuccess.style.display = 'none';

            if (password !== confirmPassword) {
                signupError.textContent = 'Passwords do not match';
                signupError.style.display = 'block';
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                signupSuccess.textContent = 'Account created successfully!';
                signupSuccess.style.display = 'block';
                signupForm.reset();

                // Store additional user data
                await db.collection('users').doc(userCredential.user.uid).set({
                    email: email,
                    createdAt: new Date(),
                    lastLogin: new Date()
                });
            } catch (error) {
                signupError.textContent = error.message;
                signupError.style.display = 'block';
            }
        });

        // Sign In
        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            // Reset messages
            signinError.style.display = 'none';
            signinSuccess.style.display = 'none';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                signinSuccess.textContent = 'Signed in successfully!';
                signinSuccess.style.display = 'block';
                signinForm.reset();
            } catch (error) {
                signinError.textContent = error.message;
                signinError.style.display = 'block';
            }
        });

        // Google Sign In
        googleSignIn.addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                // Store user data
                await db.collection('users').doc(result.user.uid).set({
                    email: result.user.email,
                    displayName: result.user.displayName,
                    lastLogin: new Date()
                }, { merge: true });
            } catch (error) {
                signinError.textContent = error.message;
                signinError.style.display = 'block';
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await auth.signOut();
            } catch (error) {
                console.error('Error signing out:', error);
            }
        });

        // Tab Switching Logic (previous code)
        const tabs = document.querySelectorAll('.tab');
        const forms = document.querySelectorAll('.form-container');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                forms.forEach(form => {
                    form.classList.remove('active');
                    form.classList.add('previous');
                });
                
                tab.classList.add('active');
                const targetForm = document.getElementById(`${tab.dataset.tab}-form`);
                targetForm.classList.add('active');
                targetForm.classList.remove('previous');
            });
        });
        
                // Modal controls
        accountIcon.addEventListener('click', () => {
            profileModal.style.display = 'block';
        });

        closeModal.addEventListener('click', () => {
            profileModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === profileModal) {
                profileModal.style.display = 'none';
            }
        });

        // Profile form submission
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (user) {
                try {
                    await db.collection('users').doc(user.uid).update({
                        displayName: document.getElementById('display-name').value,
                        location: document.getElementById('location').value,
                        profileComplete: true,
                        updatedAt: new Date()
                    });
                    setupComplete.style.display = 'block';
                } catch (error) {
                    console.error('Error updating profile:', error);
                }
            }
        });

        // Delete account
        deleteAccountBtn.addEventListener('click', async () => {
            if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                const user = auth.currentUser;
                if (user) {
                    try {
                        // Delete user data from Firestore
                        await db.collection('users').doc(user.uid).delete();
                        // Delete user account
                        await user.delete();
                    } catch (error) {
                        console.error('Error deleting account:', error);
                    }
                }
            }
        });
    </script>
</body>
</html>
