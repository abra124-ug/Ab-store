<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABStore - Loading</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #059669, #064e3b);
        }

        .container {
            width: 100%;
            max-width: 28rem;
            padding: 2rem;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: white;
            letter-spacing: 0.3em;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            font-family: "Caveat", serif;
            font-optical-sizing: auto;
        }

        .icons-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .icon {
            width: 2rem;
            height: 2rem;
            color: white;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .progress-container {
            width: 100%;
            height: 0.375rem;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: white;
            border-radius: 9999px;
            transition: width 0.3s ease-out;
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.9);
            }
        }

        .icon:nth-child(1) { animation-delay: 0s; }
        .icon:nth-child(2) { animation-delay: 0.2s; }
        .icon:nth-child(3) { animation-delay: 0.4s; }
        .icon:nth-child(4) { animation-delay: 0.6s; }
        .icon:nth-child(5) { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">Abstore</h1>
        
        <div class="icons-container">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
            
            <svg xmlns="http://www.w3.org/2000/svg" class="icon pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            
            <svg xmlns="http://www.w3.org/2000/svg" class="icon pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            
            <svg xmlns="http://www.w3.org/2000/svg" class="icon pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
            </svg>
            
            <svg xmlns="http://www.w3.org/2000/svg" class="icon pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
            </svg>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p class="loading-text">Loading your shopping experience...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progressBar');
            const duration = 5000; // 5 seconds
            const interval = 50;
            const steps = duration / interval;
            let progress = 0;

            const timer = setInterval(() => {
                progress += (100 / steps);
                
                if (progress >= 100) {
                    clearInterval(timer);
                    progress = 100;
                    // Redirect after completion
                    setTimeout(() => {
                        window.location.href = 'New.html';
                    }, 500);
                }
                
                progressBar.style.width = `${progress}%`;
            }, interval);
        });
    </script>
</body>
</html>
